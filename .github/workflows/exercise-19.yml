name: "Exercise: 19"

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  exercise-19:
    name: Exercise 19 - Connect todo-frontend with todo-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify nginx.dev.conf exists
        run: |
          set -euo pipefail
          test -s todo-app/nginx.dev.conf
          grep -q "proxy_pass http://app:5173" todo-app/nginx.dev.conf
          grep -q "proxy_pass http://server:3000/" todo-app/nginx.dev.conf
          grep -q "location /api/" todo-app/nginx.dev.conf
          echo "nginx.dev.conf found"

      - name: Verify docker-compose.dev.yml exists
        run: |
          set -euo pipefail
          test -s todo-app/docker-compose.dev.yml
          grep -q "nginx:" todo-app/docker-compose.dev.yml
          grep -q "image: nginx:1.29" todo-app/docker-compose.dev.yml
          grep -q "./nginx.dev.conf:/etc/nginx/nginx.conf:ro" todo-app/docker-compose.dev.yml
          grep -q "8080:80" todo-app/docker-compose.dev.yml
          grep -q "reverse-proxy" todo-app/docker-compose.dev.yml
          grep -q "depends_on:" todo-app/docker-compose.dev.yml
          grep -q "dev.Dockerfile" todo-app/docker-compose.dev.yml
          grep -q "VITE_BACKEND_URL=http://localhost:8080/api" todo-app/docker-compose.dev.yml
          echo "docker-compose.dev.yml found with nginx and VITE_BACKEND_URL"

      - name: Verify ports are removed from non-nginx services
        run: |
          set -euo pipefail
          if grep -n "3000:3000" todo-app/docker-compose.dev.yml; then
            echo "Backend port should not be exposed"
            exit 1
          fi
          if grep -n "5173:5173" todo-app/docker-compose.dev.yml; then
            echo "Frontend port should not be exposed"
            exit 1
          fi
          echo "Only Nginx exposes ports"

      - name: Build the dev images
        working-directory: ./todo-app
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml build

      - name: Clean previous data
        working-directory: ./todo-app
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml down -v || true
          sudo rm -rf todo-backend/redis_data
          mkdir -p todo-backend/redis_data
          sudo chmod 777 todo-backend/redis_data

      - name: Start the dev containers
        working-directory: ./todo-app
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml up -d
          echo "Waiting for Nginx to be ready..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ > /dev/null 2>&1; then
              echo "Nginx reverse proxy is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ > /dev/null
          echo "Waiting for backend API to be ready..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/todos > /dev/null 2>&1; then
              echo "Backend API is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/todos > /dev/null

      - name: Verify the reverse proxy serves the frontend
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ | grep -qi "todo"
          echo "Reverse proxy serves the todo frontend"

      - name: Verify the backend is reachable through Nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/api/todos | grep -q "Write code"
          echo "Backend API is reachable through Nginx"

      - name: Verify direct backend access does not work
        run: |
          set -euo pipefail
          if curl -fsS --max-time 5 http://localhost:3000/todos > /dev/null 2>&1; then
            echo "Direct backend access should not work"
            exit 1
          fi
          echo "Direct backend access is disabled"

      - name: Stop the containers
        if: always()
        working-directory: ./todo-app
        run: docker compose -f docker-compose.dev.yml down -v || true